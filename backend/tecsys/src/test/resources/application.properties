spring.application.name=tecsys-test
spring.datasource.url=jdbc:h2:mem:tecsys;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
bdgd.ingestion.max-upload-bytes=5368709120
bdgd.ingestion.storage=local
bdgd.ingestion.local-directory=./target/test-data/uploads
bdgd.ingestion.bucket=bdgd-raw
bdgd.ingestion.key-prefix=bdgd
bdgd.ingestion.region=sa-east-1
bdgd.ingestion.n8n-webhook-url=http://localhost:5678/webhook/get-etl-data
