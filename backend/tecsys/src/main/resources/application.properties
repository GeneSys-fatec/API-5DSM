spring.application.name=tecsys
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://apitecsysdb.cebrbvcdzi1c.us-east-1.rds.amazonaws.com:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tecsysdb}
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
bdgd.ingestion.max-upload-bytes=5368709120
bdgd.ingestion.storage=${BDGD_STORAGE:local}
bdgd.ingestion.local-directory=${BDGD_LOCAL_DIRECTORY:./data/raw}
bdgd.ingestion.bucket=${BDGD_S3_BUCKET:bdgd-raw}
bdgd.ingestion.key-prefix=${BDGD_S3_KEY_PREFIX:bdgd}
bdgd.ingestion.region=${AWS_REGION:sa-east-1}
bdgd.ingestion.n8n-webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/get-etl-data}
